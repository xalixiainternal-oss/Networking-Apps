name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk membuat GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }   # Capacitor 7 mewajibkan Java 21

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }

      - uses: gradle/actions/setup-gradle@v4   # cache Gradle otomatis

      - name: Hitung versi dari package.json
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          IFS=. read -r MA MI PA <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Uji unit Kotlin/Java (logika siklus & ambang)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Siapkan keystore (jika Secrets ada)
        id: ks
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Keystore tidak ada: membangun APK debug."
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          TASK=assembleDebug; [ "${{ steps.ks.outputs.signed }}" = "true" ] && TASK=assembleRelease
          ./gradlew $TASK -PappVersionName=${{ steps.ver.outputs.name }} -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Rapikan nama APK
        run: |
          mkdir -p out
          F=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          S=debug; [ "${{ steps.ks.outputs.signed }}" = "true" ] && S=release
          cp "$F" "out/pantau-kuota-v${{ steps.ver.outputs.name }}-$S.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pantau-kuota-apk
          path: out/*.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Pantau Kuota v${{ steps.ver.outputs.name }}
          files: out/*.apk
          prerelease: ${{ steps.ks.outputs.signed != 'true' }}
